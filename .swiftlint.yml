included:
  - Sources
  - Tests

excluded:
  - .build

disabled_rules:
  - todo                    # TODOs are tracked in commits, not by the linter
  - trailing_whitespace     # Xcode already strips this on save

opt_in_rules:
  - empty_count
  - first_where
  - last_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - closure_spacing
  - explicit_init
  - joined_default_parameter
  - operator_usage_whitespace
  - sorted_first_last
  - unavailable_function
  - vertical_parameter_alignment_on_call
  - yoda_condition

# SwiftUI bodies are legitimately long and deeply nested.
line_length:
  warning: 140
  error: 250
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 900
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level: 2

identifier_name:
  min_length: 2
  excluded: [id, x, y, to, up, ok, db]

reporter: "xcode"
